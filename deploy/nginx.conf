# Generated by deploy/generate.sh from deploy/config.env, don't edit.
#
# nginx config for kite.onl, docs.kite.onl and api.kite.onl, included inside
# the http block. All traffic arrives through the Cloudflare tunnel, which
# connects from localhost.

# Use the client IP from Cloudflare. Only the tunnel can reach nginx, so the
# header can be trusted.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# Rate limits per client IP, with a stricter one for writes. CORS preflights
# only count towards the general limit, otherwise every write counts twice.
map $request_method $kite_api_write_key {
        default $binary_remote_addr;
        GET     "";
        HEAD    "";
        OPTIONS "";
}

limit_req_zone $binary_remote_addr zone=kite_api:64m rate=10r/s;
limit_req_zone $kite_api_write_key zone=kite_api_write:64m rate=2r/s;

# Webhooks get their own looser limit. Senders like GitHub and Stripe deliver
# for everyone from a few shared IPs, and the service limits each app itself.
limit_req_zone $binary_remote_addr zone=kite_webhook:16m rate=20r/s;

limit_req_status 429;

# One upstream per service cluster. Requests for an app go to the cluster that
# runs it, split_clients hashes the same way as util.CluserForKey.
upstream kite_cluster_0 { server 127.0.0.1:8080; }
upstream kite_cluster_1 { server 127.0.0.1:8081; }
upstream kite_cluster_2 { server 127.0.0.1:8082; }
upstream kite_cluster_3 { server 127.0.0.1:8083; }

map $uri $kite_app_id {
        ~^/v1/apps/(?<id>[^/]+)/ $id;
        ~^/v1/webhooks/(?<id>[^/]+)/ $id;
        default "";
}

split_clients "${kite_app_id}" $kite_cluster {
        25% "0";
        25% "1";
        25% "2";
        * "3";
}

map $kite_cluster $kite_upstream {
        default kite_cluster_0; # requests that aren't for an app
        "0" kite_cluster_0;
        "1" kite_cluster_1;
        "2" kite_cluster_2;
        "3" kite_cluster_3;
}

# Users' bundles aren't moderated, so search engines shouldn't list them. The
# page also has a robots meta tag. add_header skips empty values.
map $uri $kite_web_robots {
        ~^/bundles/ noindex;
        default "";
}

# Link preview images set their own Cache-Control. Everything else the web
# server renders is checked on every load.
map $uri $kite_web_cache_control {
        ~^/api/og/ $upstream_http_cache_control;
        default "no-cache";
}

map $http_upgrade $kite_connection_upgrade {
        default upgrade;
        ""      "";
}

server {
        listen 127.0.0.1:80 default_server;
        server_name api.kite.onl;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kite_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 10M;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 60s;

        location / {
                limit_req zone=kite_api burst=50 delay=10;
                limit_req zone=kite_api_write burst=5;

                proxy_pass http://$kite_upstream;
        }

        location /v1/webhooks/ {
                limit_req zone=kite_webhook burst=100 nodelay;

                proxy_pass http://$kite_upstream;
        }
}

server {
        listen 127.0.0.1:80;
        server_name www.kite.onl;

        return 308 https://kite.onl$request_uri;
}

server {
        listen 127.0.0.1:80;
        server_name kite.onl;

        # public/ of the running build. Everything else is rendered by the
        # Next.js server.
        root /opt/kite-web/public;
        absolute_redirect off;

        # Pages have no trailing slash, so /tools/ redirects to /tools, the
        # canonical URL.
        rewrite ^/(.+)/$ /$1 permanent;

        # Files are checked with the server on every load, so a deploy shows
        # up right away. Locations with their own add_header don't inherit it.
        add_header Cache-Control "no-cache";

        # Served from disk instead of by the server, which only has the files
        # of the current build. Old ones are never deleted, so tabs still open
        # on the previous version can load their chunks.
        location /_next/static/ {
                root /var/www/kite-web;
                add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Analytics events from the web app, sent here instead of to OpenPanel so
        # blockers don't drop them. OpenPanel takes the client IP from
        # openpanel-client-ip, and doesn't need our cookies.
        location = /ops {
                # Resolved per request, so nginx still starts when the lookup fails.
                resolver 127.0.0.53;
                set $kite_openpanel_url https://analytics.xenon.bot/api/track;
                proxy_pass $kite_openpanel_url;
                proxy_ssl_server_name on;
                proxy_ssl_verify on;
                proxy_ssl_verify_depth 2;
                proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                proxy_set_header openpanel-client-ip $remote_addr;
                proxy_set_header Cookie "";
        }

        location / {
                try_files $uri @web;
        }

        location @web {
                proxy_pass http://127.0.0.1:3000;
                proxy_set_header Host $host;

                # Pages are checked on every load too. Next.js marks prerendered
                # ones as cacheable for a year by shared caches, which
                # Cloudflare would follow if it ever cached HTML.
                proxy_hide_header Cache-Control;
                add_header Cache-Control $kite_web_cache_control always;
                add_header X-Robots-Tag $kite_web_robots always;
        }
}

server {
        listen 127.0.0.1:80;
        server_name docs.kite.onl;

        root /var/www/kite-docs;
        absolute_redirect off;

        # Docusaurus writes pages as page.html, with trailingSlash: false.
        # page.html comes before page/, since /blog has both.
        rewrite ^/(.+)/$ /$1 permanent;

        # Like the web app's pages, while the files in /assets/ have their
        # hash in their name.
        add_header Cache-Control "no-cache";

        location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
                try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
}
