name: Release Builds

on:
  release:
    types: [created]

jobs:
  release:
    name: Release Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: kite-web/package.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: kite-web/pnpm-lock.yaml
      - name: Build Website
        run: pnpm install --frozen-lockfile && OUTPUT=export NEXT_PUBLIC_API_PUBLIC_BASE_URL="" pnpm run build
        working-directory: ./kite-web
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.21.0"
          check-latest: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: kite-service
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
